@if (data(); as d) {
  <header class="dashboard__header">
    <div class="dashboard__header-row">
      <div>
        <h1>{{ i18n.t('app.title') }}</h1>
        <p>{{ i18n.t('app.subtitle', { count: d.formulas.length }) }}</p>
      </div>
      <app-language-toggle />
    </div>
  </header>

  <app-correctness-badge [verdict]="d.verdict" class="dashboard__section" />

  <app-summary-cards
    [summaries]="d.summaries"
    [winner]="d.winner"
    [formulaCount]="d.formulas.length"
    class="dashboard__section"
  />

  <app-coverage-callout [summaries]="d.summaries" class="dashboard__section" />

  <app-formula-catalog [formulas]="d.formulas" class="dashboard__section" />

  <app-complexity-chart [runs]="d.runs" [formulas]="d.formulas" class="dashboard__section" />

  <div class="dashboard__grid dashboard__section">
    <app-runtime-chart [runs]="d.runs" [formulas]="d.formulas" />
    <app-breakdown-chart [runs]="d.runs" />
  </div>

  <section class="dashboard__section">
    <h2>{{ i18n.t('dashboard.summaryTable') }}</h2>
    <app-results-table [summaries]="d.summaries" />
  </section>
} @else {
  <div class="dashboard__loading">{{ i18n.t('dashboard.loading') }}</div>
}

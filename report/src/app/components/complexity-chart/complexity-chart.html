<div class="panel panel--featured">
  <div class="panel__header">
    <div>
      <h2>Does the ranking change as formulas get more complex?</h2>
      <p class="panel__subtitle">Average run time per formula, grouped by simple / complex / conditional</p>
    </div>
    <label class="scale-toggle">
      <input type="checkbox" [checked]="logScale()" (change)="toggleScale()" />
      Log scale
    </label>
  </div>
  <app-chart [config]="config()" [heightPx]="380" />
</div>
